[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["../../lib"]
solc = "0.8.24"
# Arc runs a paris-era EVM: no PUSH0. Required by the Circle Contracts platform too.
evm_version = "paris"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "./deployments" }]
gas_reports = ["ProofworkJobs"]

[profile.ci]
verbosity = 3
fuzz = { runs = 512 }

[fmt]
line_length = 110
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
arc_mainnet = "${ARC_MAINNET_RPC_URL}"

[etherscan]
arc_testnet = { key = "no-key-needed", url = "https://testnet.arcscan.app/api", chain = 5042002 }
