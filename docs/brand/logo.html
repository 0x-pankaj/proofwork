<!doctype html>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 512px; height: 512px; background: #14161d; display: grid; place-items: center; }
  /* A merge that lands: two branches join a trunk, and the end state is paid. */
  .mark { width: 300px; height: 300px; }
  .trunk { stroke: #e9ebf0; }
  .branch { stroke: #6d8cff; }
  path, line { fill: none; stroke-width: 26; stroke-linecap: round; }
  .node { fill: #14161d; stroke-width: 24; }
  .open { stroke: #e9ebf0; }
  .from { stroke: #6d8cff; }
  .paid { fill: #46dc9a; stroke: #46dc9a; }
</style>
<svg class="mark" viewBox="0 0 300 300">
  <!-- trunk -->
  <line class="trunk" x1="78" y1="60" x2="78" y2="240"/>
  <!-- branch curving into the trunk -->
  <path class="branch" d="M222 60 v40 a70 70 0 0 1 -70 70 h-74"/>
  <!-- nodes -->
  <circle class="node open" cx="78" cy="46" r="20"/>
  <circle class="node from" cx="222" cy="46" r="20"/>
  <circle class="node paid" cx="78" cy="254" r="26"/>
</svg>
